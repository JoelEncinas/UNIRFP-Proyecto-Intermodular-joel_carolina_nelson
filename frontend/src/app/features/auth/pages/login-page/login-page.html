<section class="ui-surface mx-auto mt-16 w-full max-w-md p-6">
  <h1 class="text-2xl font-semibold tracking-tight text-slate-900">Inicio</h1>
  <p class="mt-2 text-sm text-slate-600">Utiliza tu usuario y contrasena de BikeShare.</p>

  @if (errorMessage(); as message) {
    <div class="alert mt-4 rounded-lg border border-rose-200 bg-rose-50 px-3 py-2 text-sm font-medium text-rose-700">
      {{ message }}
    </div>
  }

  <div class="mt-5">
    <app-login-form
      [loading]="isSubmitting()"
      (submitLogin)="onLoginSubmit($event)"
    />
  </div>

  <p class="mt-4 text-sm text-slate-600">
    No tienes cuenta?
    <a class="font-semibold text-sky-700 hover:text-sky-800" routerLink="/auth/register">Registrate</a>
  </p>
</section>
