<section class="mx-auto mt-16 w-full max-w-md rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
  <h1 class="text-2xl font-semibold tracking-tight text-slate-900">Registro</h1>
  <p class="mt-2 text-sm text-slate-600">Crea tu cuenta para empezar a usar BikeShare.</p>

  @if (errorMessage(); as message) {
    <div class="alert mt-4 rounded-lg border border-rose-200 bg-rose-50 px-3 py-2 text-sm font-medium text-rose-700">
      {{ message }}
    </div>
  }

  <div class="mt-5">
    <app-register-form
      [loading]="isSubmitting()"
      (submitRegister)="onRegisterSubmit($event)"
    />
  </div>

  <p class="mt-4 text-sm text-slate-600">
    Ya tienes cuenta?
    <a class="font-semibold text-sky-700 hover:text-sky-800" routerLink="/auth/login">Accede aqui</a>
  </p>
</section>
