<div class="relative h-full min-h-[18rem] w-full lg:min-h-0">
  <div #mapContainer class="h-full min-h-[18rem] w-full lg:min-h-0" data-testid="leaflet-map-canvas"></div>

  @if (!isLoading() && !hasRenderableStations()) {
    <div class="pointer-events-none absolute inset-0 z-[1] flex items-center justify-center bg-slate-100/80">
      <p class="rounded-xl border border-slate-200 bg-white px-4 py-2 text-sm text-slate-700">
        No hay estaciones con coordenadas disponibles.
      </p>
    </div>
  }
</div>
