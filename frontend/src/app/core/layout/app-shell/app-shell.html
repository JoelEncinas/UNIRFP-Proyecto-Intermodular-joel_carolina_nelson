<div
  class="flex min-h-dvh flex-col bg-[radial-gradient(circle_at_8%_5%,rgba(142,255,210,0.35),transparent_30%),linear-gradient(180deg,#f7fbff_0%,#f1f6ff_45%,#ebf4ff_100%)] text-slate-900 lg:h-dvh lg:overflow-hidden"
>
  <header
    class="sticky top-0 z-20 flex h-16 items-center gap-4 border-b border-slate-900/10 bg-sky-50/85 px-4 backdrop-blur-md lg:px-6"
  >
    <button
      type="button"
      class="inline-flex h-11 w-11 cursor-pointer flex-col justify-center gap-[0.3rem] rounded-2xl border border-slate-900/20 bg-white/85 p-[0.65rem] lg:hidden"
      data-testid="shell-menu-button"
      (click)="toggleMobileMenu()"
      aria-label="Abrir menu"
    >
      <span class="h-[2px] w-full rounded bg-slate-900"></span>
      <span class="h-[2px] w-full rounded bg-slate-900"></span>
      <span class="h-[2px] w-full rounded bg-slate-900"></span>
    </button>

    <div class="leading-[1.1]">
      <p class="m-0 font-extrabold tracking-[0.02em]">BikeShare</p>
      <p class="m-0 mt-[0.2rem] text-[0.8rem] uppercase tracking-[0.08em] text-slate-900/75">
        Movilidad urbana
      </p>
    </div>
  </header>

  <div
    class="relative flex-1 min-h-0 lg:grid lg:grid-cols-[320px_minmax(0,1fr)]"
  >
    <app-side-panel
      [mobileOpen]="isMobileMenuOpen()"
      (panelClose)="closeMobileMenu()"
    />

    <main
      class="relative z-[1] h-full min-h-0 overflow-y-auto p-[1.1rem] lg:p-[1.6rem]"
      data-testid="shell-content"
      (click)="closeMobileMenu()"
    >
      <router-outlet />
    </main>
  </div>

  @if (isMobileMenuOpen()) {
    <button
      type="button"
      class="fixed inset-0 z-[9] border-0 bg-slate-950/45 lg:hidden"
      data-testid="shell-backdrop"
      (click)="closeMobileMenu()"
      aria-label="Cerrar menu"
    ></button>
  }
</div>
