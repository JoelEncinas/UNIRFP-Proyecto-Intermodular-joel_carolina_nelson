services:
  mysql:
    image: mysql:8
    container_name: bikeshare-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: bike_share_db
      MYSQL_USER: bikeshare
      MYSQL_PASSWORD: bikeshare
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pbikeshare"]
      interval: 5s
      timeout: 3s
      retries: 20

  db-seed:
    image: mysql:8
    container_name: bikeshare-db-seed
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./database/db_script_bike_share.sql:/seed/db_script_bike_share.sql:ro
    command: >
      sh -c "tail -n +3 /seed/db_script_bike_share.sql | mysql --protocol=tcp -h mysql -u bikeshare -pbikeshare bike_share_db"
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bikeshare-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      db-seed:
        condition: service_completed_successfully
    environment:
      DB_URL: jdbc:mysql://mysql:3306/bike_share_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: bikeshare
      DB_PASSWORD: bikeshare
      JPA_DDL_AUTO: update
      JWT_SECRET: bikesharebikesharebikesharebikesharebikeshare123456
      JWT_EXPIRATION_MS: 3600000
      CORS_ALLOWED_ORIGINS: http://localhost,http://127.0.0.1
      STRIPE_SECRET_KEY: ""
      STRIPE_WEBHOOK_SECRET: ""
      STRIPE_SUCCESS_URL: http://localhost/app/map?payment=success
      STRIPE_CANCEL_URL: http://localhost/app/map?payment=cancel
      STRIPE_CURRENCY: eur
      RENTAL_UNLOCK_FEE: 1
    expose:
      - "8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bikeshare-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  mysql_data:
